<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Dark background -->
  <rect width="128" height="128" fill="#1a1a1a"/>
  <!-- Floppy disk body -->
  <rect x="16" y="12" width="96" height="104" rx="4" fill="#3a3a3a"/>
  <!-- Metal slider with opening on right -->
  <rect x="34" y="11" width="60" height="36" fill="#71717a"/>
  <rect x="67" y="17" width="20" height="24" fill="#3a3a3a"/>
  <!-- Label area -->
  <rect x="28" y="56" width="72" height="52" rx="2" fill="#f5f5f5"/>
  <!-- Blue stripe on label -->
  <rect x="28" y="56" width="72" height="14" rx="2" fill="#4a90d9"/>
  <rect x="28" y="70" width="72" height="2" fill="#f5f5f5"/>
</svg>